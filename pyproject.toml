[project]
name = "vpricing-app"
version = "0.1.0"
description = "Quote comparison web app for subcontractor BQ pricing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
